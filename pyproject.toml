[project]
name = "santorinimatrixreloaded"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.10",
    "gymnasium>=1.3.0",
    "jax>=0.11.2",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["santorinai"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
